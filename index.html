<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Selector de Fases</title>
<script src="https://cloudflare.com"></script>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #050508; display: flex; align-items: center; justify-content: center; overflow: hidden; font-family: monospace; }
  #wrap { position: relative; width: min(100vw, 177.78vh, 1024px); height: min(56.25vw, 100vh, 576px); box-shadow: 0 0 20px rgba(255, 150, 0, 0.2), 0 0 0 4px #1a1a2e; background: #000; }
  canvas { display: block; width: 100% !important; height: 100% !important; image-rendering: pixelated; }
</style>
</head>
<body>
<div id="wrap"></div>
<script>
const GITHUB_USER = "coquetornado";
const REPO_NAME = "retroJuego";

// Tu menú con la lista manual de tus ficheros del repositorio
const listaFicheros = [
  "fase1.html",
  "fase2.html"
];

const W = 384, H = 216;

function setup() {
  let c = createCanvas(W, H);
  c.parent('wrap');
  noSmooth();
}

function draw() {
  background(15, 15, 25);
  fill(255, 180, 0);
  textAlign(CENTER, TOP);
  textSize(16);
  text("SELECTOR DE FASES", W / 2, 20);
  
  fill(200);
  textSize(8);
  text("Pulsa el numero en tu teclado para iniciar:", W / 2, 50);
  
  for (let i = 0; i < listaFicheros.length; i++) {
    if (i === 0) fill('#99ffff');
    else fill(150);
    text(`[${i + 1}] - ${listaFicheros[i]}`, W / 2, 80 + (i * 16));
  }
}

function keyPressed() {
  let index = parseInt(key) - 1;
  if (index >= 0 && index < listaFicheros.length) {
    window.location.href = `https://${GITHUB_USER}.github.io/${REPO_NAME}/${listaFicheros[index]}`;
  }
}
</script>
</body>
</html>
