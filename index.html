<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Retro Phase Selector 8-Bit</title>
<!-- Favicon retro -->
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🕹️</text></svg>">

<!-- Librería p5.js -->
<script src="https://cdn.jsdelivr.net/npm/p5@1.9.4/lib/p5.min.js"></script>

<style>
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #030108;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden; font-family: 'Courier New', monospace;
    user-select: none;
  }
  #wrap {
    position: relative;
    width: min(100vw, 177.78vh, 1024px);
    height: min(56.25vw, 100vh, 576px);
    box-shadow: 0 0 40px rgba(255, 0, 128, 0.4), 0 0 0 4px #1f0a2e;
    background: #000;
  }
  canvas {
    display: block; width: 100% !important; height: 100% !important;
    image-rendering: pixelated; image-rendering: crisp-edges;
  }
</style>
</head>
<body>
<div id="wrap"></div>

<script>
// ==========================================
// CONFIGURACIÓN Y VARIABLES GLOBALES
// ==========================================
const GITHUB_USER = "coquetornado";
const REPO_NAME = "retroJuego";
const W = 384, H = 216;

let listaFicheros = [];
let estado = "CARGANDO"; // "CARGANDO", "LISTO", "ERROR", "VACIO"
let selectedIndex = 0;

// Efectos Visuales
let stars = [];
let gridOffset = 0;
let particles = [];
let scanlineBuffer;

// Audio Synth Context
let actx = null;

function playSound(type) {
  if (!actx) {
    try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){}
  }
  if (!actx) return;
  if (actx.state === 'suspended') actx.resume();

  try {
    let now = actx.currentTime;
    let osc = actx.createOscillator();
    let gain = actx.createGain();
    osc.connect(gain); gain.connect(actx.destination);

    if (type === 'move') {
      osc.type = 'square';
      osc.frequency.setValueAtTime(300, now);
      osc.frequency.exponentialRampToValueAtTime(600, now + 0.05);
      gain.gain.setValueAtTime(0.08, now);
      gain.gain.linearRampToValueAtTime(0.01, now + 0.05);
      osc.start(now); osc.stop(now + 0.05);
    } else if (type === 'select') {
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(440, now);
      osc.frequency.setValueAtTime(880, now + 0.08);
      gain.gain.setValueAtTime(0.12, now);
      gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
      osc.start(now); osc.stop(now + 0.2);
    }
  } catch(e){}
}

// ==========================================
// SETUP Y CARGA DE DATOS
// ==========================================
function setup() {
  let c = createCanvas(W, H);
  c.parent('wrap');
  noSmooth();

  // Generar Estrellas
  for (let i = 0; i < 40; i++) {
    stars.push({ x: random(W), y: random(H * 0.55), size: random([1, 2]), speed: random(0.2, 0.8) });
  }

  // Generar Buffer para Scanlines (Efecto CRT)
  scanlineBuffer = createGraphics(W, H);
  scanlineBuffer.stroke(0, 0, 0, 45);
  for (let y = 0; y < H; y += 2) {
    scanlineBuffer.line(0, y, W, y);
  }

  cargarFasesDesdeGitHub();
}

function cargarFasesDesdeGitHub() {
  const url = `https://api.github.com/repos/${GITHUB_USER}/${REPO_NAME}/contents/`;

  fetch(url)
    .then(response => {
      if (!response.ok) throw new Error("Error con la API de GitHub");
      return response.json();
    })
    .then(data => {
      listaFicheros = data
        .filter(item => 
          item.type === "file" && 
          item.name.toLowerCase().endsWith(".html") && 
          item.name.toLowerCase() !== "index.html"
        )
        .map(item => item.name)
        .sort();

      estado = listaFicheros.length > 0 ? "LISTO" : "VACIO";
    })
    .catch(err => {
      console.error(err);
      estado = "ERROR";
    });
}

// ==========================================
// BUCLE PRINCIPAL DE DIBUJO (DRAW)
// ==========================================
function draw() {
  background(8, 4, 20);

  // 1. Estrellas
  drawStars();

  // 2. Sol Synthwave
  drawSun();

  // 3. Suelo Grid 3D Animado
  drawGrid3D();

  // 4. Marco Neón Principal
  drawUIFrame();

  // 5. Contenido / Lista de Fases
  if (estado === "CARGANDO") {
    fill(255, 180, 0); textSize(9); textAlign(CENTER, CENTER);
    text("CONECTANDO A GITHUB...", W/2, H/2);
    let dots = ".".repeat((floor(frameCount / 12) % 4));
    text(dots, W/2, H/2 + 12);
  } else if (estado === "ERROR") {
    fill(255, 60, 100); textSize(9); textAlign(CENTER, CENTER);
    text("ERROR AL CARGAR REPOSITORIO", W/2, H/2);
  } else if (estado === "VACIO") {
    fill(255, 200, 80); textSize(9); textAlign(CENTER, CENTER);
    text("NO SE ENCONTRARON FASES .HTML", W/2, H/2);
  } else if (estado === "LISTO") {
    drawMenu();
  }

  // 6. Partículas Neón
  drawParticles();

  // 7. Capa de Filtro Scanlines CRT
  image(scanlineBuffer, 0, 0);
}

// ==========================================
// COMPONENTES GRÁFICOS
// ==========================================
function drawStars() {
  noStroke();
  fill(255, 230);
  for (let s of stars) {
    s.x = (s.x - s.speed + W) % W;
    if (random() > 0.95) fill(255, 100, 200); else fill(255, 230);
    rect(s.x, s.y, s.size, s.size);
  }
}

function drawSun() {
  let cx = W / 2, cy = 90, r = 38;
  noStroke();
  // Resplandor
  for (let i = 5; i > 0; i--) {
    fill(255, 0, 128, 15 * i);
    circle(cx, cy, (r + i * 4) * 2);
  }
  // Círculo del Sol
  fill(255, 210, 0);
  circle(cx, cy, r * 2);

  // Franjas de corte horizontal
  fill(8, 4, 20);
  for (let y = cy - 10; y < cy + r; y += 4) {
    let h = map(y, cy - 10, cy + r, 1, 3);
    rect(cx - r - 5, y, (r + 5) * 2, h);
  }
}

function drawGrid3D() {
  stroke(255, 0, 128, 180);
  strokeWeight(1);
  let horizon = 115;

  // Líneas verticales en perspectiva
  for (let x = -W; x <= W * 2; x += 24) {
    line(x, H, W/2 + (x - W/2) * 0.15, horizon);
  }

  // Líneas horizontales en movimiento
  gridOffset = (gridOffset + 0.6) % 16;
  for (let y = 0; y < H - horizon; y += 16) {
    let py = horizon + Math.pow((y + gridOffset) / (H - horizon), 2) * (H - horizon);
    if (py >= horizon && py <= H) {
      line(0, py, W, py);
    }
  }
}

function drawUIFrame() {
  noFill();
  stroke(0, 255, 240); strokeWeight(1);
  rect(12, 10, W - 24, H - 20);
  stroke(255, 0, 128);
  rect(14, 12, W - 28, H - 24);

  // Esquinas biseladas
  fill(0, 255, 240); noStroke();
  rect(10, 8, 5, 5); rect(W - 15, 8, 5, 5);
  rect(10, H - 13, 5, 5); rect(W - 15, H - 13, 5, 5);

  // Título Superior (Banner Neón)
  fill(10, 5, 25); stroke(0, 255, 240);
  rect(W/2 - 75, 4, 150, 16);

  fill(255, 230, 0); noStroke();
  textAlign(CENTER, CENTER); textSize(8);
  text("★ SELECTOR DE FASES ★", W/2, 12);
}

function drawMenu() {
  let startY = 48;
  let itemHeight = 18;

  // Control con Ratón
  if (mouseX >= 20 && mouseX <= W - 20) {
    let hoverIdx = floor((mouseY - startY + itemHeight/2) / itemHeight);
    if (hoverIdx >= 0 && hoverIdx < listaFicheros.length && hoverIdx !== selectedIndex) {
      selectedIndex = hoverIdx;
      playSound('move');
    }
  }

  for (let i = 0; i < listaFicheros.length; i++) {
    let y = startY + (i * itemHeight);
    if (y > H - 35) break;

    let isSelected = (i === selectedIndex);

    if (isSelected) {
      // Caja de selección activada
      fill(255, 0, 128, 80); stroke(0, 255, 240);
      rect(W/2 - 110, y - 7, 220, 14);

      // Emisión de partículas
      if (frameCount % 4 === 0) {
        particles.push({
          x: random(W/2 - 105, W/2 + 105),
          y: y + random(-5, 5),
          vx: random(-0.5, 0.5), vy: random(-0.8, -0.2),
          life: 20, col: random() > 0.5 ? '#00ffff' : '#ff0080'
        });
      }

      fill(255, 255, 255); noStroke();
      textAlign(CENTER, CENTER); textSize(8);
      text(`►  [${i + 1}]  ${listaFicheros[i].toUpperCase()}  ◄`, W/2, y);
    } else {
      fill(160, 170, 200); noStroke();
      textAlign(CENTER, CENTER); textSize(8);
      text(`[${i + 1}]  ${listaFicheros[i]}`, W/2, y);
    }
  }

  // Instrucciones Pie de Página
  fill(0, 255, 240); textSize(6); textAlign(CENTER, CENTER);
  text("USA FLECHAS [▲/▼], RATÓN O NÚMEROS + ENTER PARA JUGAR", W/2, H - 18);
}

function drawParticles() {
  noStroke();
  for (let i = particles.length - 1; i >= 0; i--) {
    let p = particles[i];
    p.x += p.vx; p.y += p.vy; p.life--;
    fill(p.col); rect(p.x, p.y, 1.5, 1.5);
    if (p.life <= 0) particles.splice(i, 1);
  }
}

// ==========================================
// INTERACCIÓN Y CONTROLES
// ==========================================
function keyPressed() {
  if (estado !== "LISTO") return;

  if (keyCode === UP_ARROW) {
    selectedIndex = (selectedIndex - 1 + listaFicheros.length) % listaFicheros.length;
    playSound('move');
  } else if (keyCode === DOWN_ARROW) {
    selectedIndex = (selectedIndex + 1) % listaFicheros.length;
    playSound('move');
  } else if (keyCode === ENTER) {
    iniciarFase(selectedIndex);
  } else {
    let num = parseInt(key) - 1;
    if (!isNaN(num) && num >= 0 && num < listaFicheros.length) {
      selectedIndex = num;
      iniciarFase(num);
    }
  }
}

function mousePressed() {
  if (estado !== "LISTO") return;
  if (mouseX >= 20 && mouseX <= W - 20 && mouseY >= 35 && mouseY <= H - 25) {
    iniciarFase(selectedIndex);
  }
}

function iniciarFase(index) {
  if (index >= 0 && index < listaFicheros.length) {
    playSound('select');
    setTimeout(() => {
      window.location.href = `https://${GITHUB_USER}.github.io/${REPO_NAME}/${listaFicheros[index]}`;
    }, 150);
  }
}
</script>
</body>
</html>
