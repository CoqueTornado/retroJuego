<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Emerita Hub</title>
<!-- CARGA DE LIBRERÍA P5.JS VALIDADAS -->
<script src="https://cloudflare.com"></script>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #050508;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    font-family: monospace;
  }
  #wrap {
    position: relative;
    width: min(100vw, 177.78vh, 1024px);
    height: min(56.25vw, 100vh, 576px);
    box-shadow: 0 0 20px rgba(255, 150, 0, 0.2), 0 0 0 4px #1a1a2e;
    background: #000;
  }
  canvas {
    display: block;
    width: 100% !important;
    height: 100% !important;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }
</style>
</head>
<body>

<div id="wrap"></div>

<script>
// CONFIGURACIÓN DE TU REPOSITORIO
const GITHUB_USER = "coquetornado"; 
const REPO_NAME = "retroJuego";

let gameStarted = false;
let availableLevels = [];

const W = 384, H = 216, GROUND_Y = 180;

function setup() {
  let c = createCanvas(W, H);
  c.parent('wrap');
  noSmooth();
}

function draw() {
  background(15, 15, 25);
  
  if (!gameStarted) {
    // Texto del menú principal
    fill(255, 180, 0);
    textAlign(CENTER, CENTER);
    textSize(16);
    text("EMERITA HUB", W / 2, H / 2 - 10);
    
    fill(255);
    textSize(8);
    text("PULSA [ ESPACIO ] PARA INICIAR EL TEST", W / 2, H / 2 + 15);
  } else {
    // Dibujo del escenario básico de prueba
    background(100, 180, 240);
    
    // Suelo
    fill(50, 150, 50);
    noStroke();
    rect(0, GROUND_Y, W, H - GROUND_Y);
    
    // Jugador (Cubo verde)
    fill(0, 255, 50);
    rect(60, GROUND_Y - 18, 12, 18);
  }
}

function keyPressed() {
  if (key === ' ') {
    gameStarted = true;
  }
}
</script>
</body>
</html>
