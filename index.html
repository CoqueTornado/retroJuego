<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Emerita Hub - Selector Automático</title>
<!-- Librería gráfica p5.js -->
<script src="https://cloudflare.com"></script>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #050508; display: flex; align-items: center; justify-content: center; overflow: hidden; font-family: monospace; }
  #wrap { position: relative; width: min(100vw, 177.78vh, 1024px); height: min(56.25vw, 100vh, 576px); box-shadow: 0 0 20px rgba(255, 150, 0, 0.2), 0 0 0 4px #1a1a2e; background: #000; }
  canvas { display: block; width: 100% !important; height: 100% !important; image-rendering: pixelated; }
</style>
</head>
<body>

<div id="wrap"></div>

<script>
// CONFIGURACIÓN DE RUTAS DE TU PERFIL
const GITHUB_USER = "CoqueTornado";
const REPO_NAME = "retroJuego";

let availableLevels = [];
let loadingError = false;
const W = 384, H = 216;

function preload() {
  // Conexión limpia al endpoint oficial de la API de GitHub
  let url = `https://github.com{GITHUB_USER}/${REPO_NAME}/contents/`;
  
  fetch(url)
    .then(response => {
      if (!response.ok) throw new Error("Error en servidor");
      return response.json();
    })
    .then(data => {
      if (Array.isArray(data)) {
        // Escanea y añade de forma automática solo si termina en .html
        availableLevels = data
          .filter(file => file.name.endsWith('.html') && file.name !== 'index.html')
          .map(file => file.name);
      }
    })
    .catch(err => {
      console.error("Fallo de escaneo en la API:", err);
      loadingError = true;
    });
}

function setup() {
  let c = createCanvas(W, H);
  c.parent('wrap');
  noSmooth();
}

function draw() {
  background(15, 15, 25);
  
  // Encabezado del sistema
  fill(255, 180, 0);
  textAlign(CENTER, TOP);
  textSize(14);
  text("EMERITA - NAVEGADOR AUTOMÁTICO", W / 2, 15);
  
  fill(200);
  textSize(8);
  text("Pulsa el número asignado para arrancar la fase:", W / 2, 38);
  
  if (loadingError) {
    fill('#ff3333');
    text("Error de sincronización con la API de GitHub", W / 2, H / 2);
    return;
  }

  // Si no hay archivos o la API tarda un segundo en responder
  if (availableLevels.length === 0) {
    fill(130);
    text("Buscando ficheros en el repositorio...", W / 2, H / 2);
  } else {
    // Pinta en pantalla de forma dinámica todo lo que encuentra en tu repositorio
    for (let i = 0; i < availableLevels.length; i++) {
      fill(235);
      textAlign(LEFT, TOP);
      text(`[ ${i + 1} ]  ${availableLevels[i]}`, W / 2 - 85, 65 + (i * 18));
    }
  }
  
  // Pie de pantalla indicador
  fill(90);
  textAlign(CENTER, TOP);
  text("Los nuevos .html subidos aparecerán aquí solos", W / 2, H - 22);
}

function keyPressed() {
  let index = parseInt(key) - 1;
  
  // Redirección dinámica basada en los elementos actuales del índice
  if (index >= 0 && index < availableLevels.length) {
    let destinoUrl = `https://${GITHUB_USER}.github.io/${REPO_NAME}/${availableLevels[index]}`;
    window.location.href = destinoUrl;
  }
}
</script>
</body>
</html>
