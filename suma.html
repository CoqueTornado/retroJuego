<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suma 10 - Edición Coque Tornado</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            user-select: none;
        }

        h1 { color: #333; margin-bottom: 10px; }
        
        .stats {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            font-size: 1.2rem;
            font-weight: bold;
            color: #555;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(8, 50px);
            grid-template-rows: repeat(8, 50px);
            gap: 5px;
            background-color: #bbada0;
            padding: 10px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        .cell {
            width: 50px;
            height: 50px;
            background-color: #cdc1b4;
            border-radius: 4px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            font-weight: bold;
            color: #776e65;
            cursor: pointer;
            transition: transform 0.1s, background-color 0.2s;
        }

        .cell.selected {
            background-color: #f2b179;
            transform: scale(1.1);
            box-shadow: 0 0 10px rgba(242, 177, 121, 0.8);
            z-index: 10;
        }

        .cell.matched {
            animation: pop 0.3s ease-out;
            background-color: #edcf72;
            color: #f9f6f2;
        }

        @keyframes pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        .controls {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        button {
            padding: 10px 20px;
            font-size: 1rem;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            background-color: #8f7a66;
            color: white;
            transition: background 0.2s;
        }

        button:hover { background-color: #7f6a56; }

        .hint-btn {
            background-color: #ffcc00;
            color: #333;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
            position: relative;
        }

        .hint-btn:disabled {
            background-color: #ccc;
            cursor: not-allowed;
            opacity: 0.7;
        }

        .hint-count {
            background: #333;
            color: #fff;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            font-size: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Modal de Recarga */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal {
            background: white;
            padding: 30px;
            border-radius: 10px;
            text-align: center;
            max-width: 400px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        .modal h2 { color: #e91e63; margin-top: 0; }
        .modal p { font-size: 1.1rem; line-height: 1.5; }
        
        .music-link {
            display: inline-block;
            margin: 15px 0;
            padding: 10px 20px;
            background: #1db954; /* Spotify green */
            color: white;
            text-decoration: none;
            border-radius: 25px;
            font-weight: bold;
            transition: transform 0.2s;
        }
        .music-link:hover { transform: scale(1.05); }

        .reload-btn {
            background: #333;
            margin-top: 10px;
        }

        .message {
            height: 20px;
            color: #d9534f;
            font-weight: bold;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <h1>Suma 10</h1>
    
    <div class="stats">
        <span>Puntuación: <span id="score">0</span></span>
    </div>

    <div class="board" id="board">
        <!-- Celdas generadas por JS -->
    </div>

    <div class="message" id="message"></div>

    <div class="controls">
        <button class="hint-btn" id="hintBtn" onclick="useHint()">
            💡 Pista <span class="hint-count" id="hintCount">3</span>
        </button>
        <button onclick="initGame()">Reiniciar Juego</button>
    </div>

    <!-- Modal para recargar pistas -->
    <div class="modal-overlay" id="reloadModal">
        <div class="modal">
            <h2>¡Sin Pistas! ⚡</h2>
            <p>Te has quedado sin bombillitas.</p>
            <p>Para recargar tus 3 pistas, necesitas escuchar un temazo de <strong>Coque Tornado</strong>.</p>
            
            <a href="https://open.spotify.com/artist/4Z8W4fKeB5YxbusRsdQVPb?si=spotify_link_placeholder" target="_blank" class="music-link" id="musicLink">
                🎵 Escuchar a Coque Tornado
            </a>
            
            <br>
            <button class="reload-btn" onclick="reloadHints()">¡Ya la escuché! Recargar</button>
        </div>
    </div>

    <script>
        const BOARD_SIZE = 64; // 8x8
        const ROWS = 8;
        const COLS = 8;
        let board = [];
        let selectedCell = null;
        let score = 0;
        let hintsLeft = 3;

        const boardElement = document.getElementById('board');
        const scoreElement = document.getElementById('score');
        const messageElement = document.getElementById('message');
        const hintBtn = document.getElementById('hintBtn');
        const hintCountSpan = document.getElementById('hintCount');
        const reloadModal = document.getElementById('reloadModal');
        const musicLink = document.getElementById('musicLink');

        // Configuración de la canción (Puedes cambiar este enlace por uno específico de Coque Tornado)
        // Busqué un enlace genérico, pero idealmente deberías poner tu canción favorita aquí.
        const COQUE_TORNADO_URL = "https://www.youtube.com/results?search_query=coque+tornado"; 

        function initGame() {
            board = [];
            score = 0;
            selectedCell = null;
            hintsLeft = 3;
            updateUI();
            messageElement.textContent = "";
            
            // Generar tablero inicial aleatorio
            for (let i = 0; i < BOARD_SIZE; i++) {
                board.push(Math.floor(Math.random() * 9) + 1);
            }
            
            // Asegurar que haya al menos un movimiento posible al inicio
            while (!hasPossibleMoves()) {
                board = [];
                for (let i = 0; i < BOARD_SIZE; i++) {
                    board.push(Math.floor(Math.random() * 9) + 1);
                }
            }

            renderBoard();
        }

        function renderBoard() {
            boardElement.innerHTML = '';
            for (let i = 0; i < BOARD_SIZE; i++) {
                const cell = document.createElement('div');
                cell.classList.add('cell');
                if (board[i] !== 0) {
                    cell.textContent = board[i];
                    cell.dataset.index = i;
                    cell.onclick = () => handleCellClick(i);
                    
                    if (selectedCell === i) {
                        cell.classList.add('selected');
                    }
                } else {
                    cell.style.visibility = 'hidden';
                }
                boardElement.appendChild(cell);
            }
            updateUI();
        }

        function handleCellClick(index) {
            if (board[index] === 0) return;

            if (selectedCell === null) {
                selectedCell = index;
                renderBoard();
            } else if (selectedCell === index) {
                selectedCell = null;
                renderBoard();
            } else {
                checkMove(selectedCell, index);
                selectedCell = null;
                renderBoard();
            }
        }

        function checkMove(idx1, idx2) {
            const val1 = board[idx1];
            const val2 = board[idx2];

            // Verificar adyacencia (sin números en medio)
            const row1 = Math.floor(idx1 / COLS);
            const col1 = idx1 % COLS;
            const row2 = Math.floor(idx2 / COLS);
            const col2 = idx2 % COLS;

            const isAdjacent = (Math.abs(row1 - row2) + Math.abs(col1 - col2)) === 1;

            if (!isAdjacent) {
                showMessage("Los números deben estar juntos (arriba, abajo, izquierda o derecha).");
                return;
            }

            // Reglas: Sumar 10 o ser iguales
            if (val1 + val2 === 10 || val1 === val2) {
                // Éxito
                board[idx1] = 0;
                board[idx2] = 0;
                score += (val1 + val2);
                showMessage("¡Bien hecho!");
                
                // Comprobar victoria o fin de juego
                setTimeout(() => {
                    if (!hasPossibleMoves()) {
                        if (board.some(n => n !== 0)) {
                            alert("¡Juego terminado! No hay más movimientos posibles.");
                        } else {
                            alert("¡Felicidades! ¡Has limpiado el tablero!");
                        }
                        initGame();
                    } else {
                        renderBoard();
                    }
                }, 200);
            } else {
                showMessage("Esos números no valen. Deben sumar 10 o ser iguales.");
            }
        }

        function hasPossibleMoves() {
            for (let i = 0; i < BOARD_SIZE; i++) {
                if (board[i] === 0) continue;
                
                const row = Math.floor(i / COLS);
                const col = i % COLS;
                const neighbors = [
                    {r: row-1, c: col}, // Arriba
                    {r: row+1, c: col}, // Abajo
                    {r: row, c: col-1}, // Izquierda
                    {r: row, c: col+1}  // Derecha
                ];

                for (let n of neighbors) {
                    if (n.r >= 0 && n.r < ROWS && n.c >= 0 && n.c < COLS) {
                        const neighborIdx = n.r * COLS + n.c;
                        if (board[neighborIdx] !== 0) {
                            if (board[i] + board[neighborIdx] === 10 || board[i] === board[neighborIdx]) {
                                return true;
                            }
                        }
                    }
                }
            }
            return false;
        }

        function useHint() {
            if (hintsLeft <= 0) {
                showReloadModal();
                return;
            }

            // Buscar un par válido
            for (let i = 0; i < BOARD_SIZE; i++) {
                if (board[i] === 0) continue;
                
                const row = Math.floor(i / COLS);
                const col = i % COLS;
                const neighbors = [
                    {r: row-1, c: col}, 
                    {r: row+1, c: col}, 
                    {r: row, c: col-1}, 
                    {r: row, c: col+1}  
                ];

                for (let n of neighbors) {
                    if (n.r >= 0 && n.r < ROWS && n.c >= 0 && n.c < COLS) {
                        const neighborIdx = n.r * COLS + n.c;
                        if (board[neighborIdx] !== 0) {
                            if (board[i] + board[neighborIdx] === 10 || board[i] === board[neighborIdx]) {
                                // Encontrado, resaltar
                                selectedCell = i;
                                renderBoard();
                                // Resaltar temporalmente el segundo también visualmente (truco simple)
                                setTimeout(() => {
                                    const cells = document.querySelectorAll('.cell');
                                    if(cells[neighborIdx]) {
                                        cells[neighborIdx].style.backgroundColor = '#ffeb3b';
                                        setTimeout(() => {
                                            cells[neighborIdx].style.backgroundColor = '';
                                            selectedCell = null;
                                            renderBoard();
                                        }, 1000);
                                    }
                                }, 100);
                                
                                hintsLeft--;
                                updateUI();
                                return;
                            }
                        }
                    }
                }
            }
            showMessage("No hay movimientos disponibles (debería haberse reiniciado).");
        }

        function showReloadModal() {
            // Actualizar enlace de música por si acaso
            musicLink.href = COQUE_TORNADO_URL;
            reloadModal.style.display = 'flex';
        }

        function reloadHints() {
            // Aquí podrías añadir lógica para verificar si realmente escuchó la canción
            // Por ahora, asumimos que si cierra el modal o pulsa el botón, ya la escuchó.
            hintsLeft = 3;
            reloadModal.style.display = 'none';
            updateUI();
            showMessage("¡Pistas recargadas! Gracias por escuchar a Coque Tornado.");
        }

        function showMessage(msg) {
            messageElement.textContent = msg;
            setTimeout(() => {
                messageElement.textContent = "";
            }, 3000);
        }

        function updateUI() {
            scoreElement.textContent = score;
            hintCountSpan.textContent = hintsLeft;
            if (hintsLeft === 0) {
                hintBtn.disabled = true;
                hintBtn.textContent = "💡 Sin Pistas";
            } else {
                hintBtn.disabled = false;
                hintBtn.innerHTML = `💡 Pista <span class="hint-count">${hintsLeft}</span>`;
            }
        }

        // Iniciar juego al cargar
        initGame();

    </script>
</body>
</html>
